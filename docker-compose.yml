# Весь стенд:
#   cp .env.example .env            # один раз: впишите в .env свой токен admin API
#   docker compose up --build -d
#
# Балансировщик стартует с ПУСТЫМ пулом: список бэкендов не записан ни здесь, ни в коде.
# Бэкенды добавляют и удаляют запросами к admin API (см. README, раздел «Запуск в Docker»):
#   POST   /v1/backends        {"url": "http://b1:9000"}
#   DELETE /v1/backends/{id}
#
#   https://localhost:8443    балансировщик (TLS 1.3)
#   http://localhost:9090     Prometheus
#   http://localhost:3000     Grafana (дашборд "mylb")
#   http://localhost:9100     /metrics балансировщика (для curl)
#   http://localhost:9101     admin API: бэкенды, сертификат, настройки
#   http://localhost:9001-4   тестовые серверы b1-b4 напрямую (для экспериментов с health-check)
#
# Все порты привязаны к 127.0.0.1: снаружи, из вашей сети, ничего не видно.
# Клиентский порт 8443 можно открыть на другом интерфейсе переменной LB_BIND (см. сервис lb).

x-backend: &backend
  build: .
  image: mylb:local
  init: true            # tini как PID 1: иначе контейнер игнорирует SIGTERM и останавливается 10 с
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c",
           "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/healthz', timeout=2).status == 200 else 1)"]
    interval: 3s
    timeout: 3s
    retries: 10
    start_period: 2s

services:
  # Одноразовая задача: генерирует самоподписанный сертификат в общий том.
  certgen:
    build: .
    image: mylb:local
    user: root
    entrypoint: ["bash", "-c"]
    command:
      - |
        if [ ! -f /certs/server.crt ]; then
          CERT_DIR=/certs bash scripts/gen-cert.sh
        fi
        # Каталог и файлы отдаём пользователю app (uid 10001), от которого работает lb:
        # admin API заменяет сертификат, а для этого нужно право записи в каталог.
        chown -R 10001 /certs
        chmod 644 /certs/server.crt
        chmod 600 /certs/server.key   # ключ читает только владелец
    volumes:
      - certs:/certs
    restart: "no"

  # Тестовые серверы. Это не настройка балансировщика, а просто серверы, которые есть в сети:
  # балансировщик о них не знает, пока сервер не добавят запросом POST /v1/backends.
  # Внутри docker-сети их адреса: http://b1:9000 ... http://b4:9000 (имя сервиса и порт 9000).
  # Нужен ещё один сервер? Скопируйте блок, поменяйте имя (b5) и порт на хосте (9005),
  # потом `docker compose up -d` и POST /v1/backends {"url": "http://b5:9000"}.
  b1:
    <<: *backend
    entrypoint: ["python", "demo_backend.py", "--addr", "0.0.0.0:9000", "--name", "b1"]
    ports: ["127.0.0.1:9001:9000"]
  b2:
    <<: *backend
    entrypoint: ["python", "demo_backend.py", "--addr", "0.0.0.0:9000", "--name", "b2"]
    ports: ["127.0.0.1:9002:9000"]
  b3:
    <<: *backend
    entrypoint: ["python", "demo_backend.py", "--addr", "0.0.0.0:9000", "--name", "b3"]
    ports: ["127.0.0.1:9003:9000"]
  b4:
    <<: *backend
    entrypoint: ["python", "demo_backend.py", "--addr", "0.0.0.0:9000", "--name", "b4"]
    ports: ["127.0.0.1:9004:9000"]

  lb:
    build: .
    image: mylb:local
    init: true
    restart: unless-stopped
    # Graceful shutdown у LB занимает до 15 с; без этого Docker убьёт его через 10 с.
    stop_grace_period: 20s
    depends_on:
      certgen:
        condition: service_completed_successfully
      # От b1-b4 балансировщик не зависит: он может стартовать и без единого бэкенда.
    command:
      - "--listen=0.0.0.0:8443"
      - "--metrics=0.0.0.0:9100"      # внутри docker-сети; наружу порт открыт только на loopback
      - "--admin=0.0.0.0:9101"        # то же самое
      - "--state-file=/state/mylb-state.json"
      - "--cert=/certs/server.crt"
      - "--key=/certs/server.key"
      # Флагов --backends и --max-conns здесь нет: бэкенды и настройки задаются через admin API
      # и хранятся в файле состояния (том state), поэтому переживают пересоздание контейнера.
    environment:
      # Токен admin API. Без admin API в балансировщик нельзя добавить ни одного бэкенда,
      # поэтому токен обязателен: если его нет, compose остановится с этим сообщением.
      # Значение берётся из файла .env рядом с этим файлом или из переменной окружения.
      MYLB_ADMIN_TOKEN: ${MYLB_ADMIN_TOKEN:?нужен токен admin API - скопируйте .env.example в .env и впишите свой токен}
    volumes:
      - certs:/certs          # на запись: admin API заменяет файлы сертификата
      - state:/state          # файл состояния admin API переживает пересоздание контейнера
    ports:
      # Формат: IP_на_машине:порт_на_машине:порт_в_контейнере.
      # На каком сетевом интерфейсе машины принимать клиентов, задаёт переменная LB_BIND
      # (в .env или в окружении). По умолчанию 127.0.0.1: стенд виден только с этой машины.
      #   LB_BIND=192.168.1.10   только интерфейс с этим адресом
      #   LB_BIND=0.0.0.0        все интерфейсы
      # Метрики и admin API ниже намеренно всегда на 127.0.0.1: у admin API нет TLS.
      - "${LB_BIND:-127.0.0.1}:8443:8443"
      - "127.0.0.1:9100:9100"
      - "127.0.0.1:9101:9101"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 6

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    depends_on: [lb]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      # Учебный стенд, доступен только с localhost: пускаем без логина.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]

volumes:
  certs:
  state:
  prometheus-data:
  grafana-data:
